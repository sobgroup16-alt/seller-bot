# ============================================================
#  ТЕКСТЫ БОТА ЕЛЕНЫ ТИМОШЕНКО
#  Здесь все сообщения и надписи на кнопках. Код трогать не нужно.
#
#  Как править:
#   • Меняйте только текст после двоеточия или внутри блока «|».
#   • Отступы (пробелы в начале строк) не трогайте — по ним бот понимает структуру.
#   • Слова в фигурных скобках {name}, {lead_title} бот подставит сам. Не переводите их.
#   • Можно выделять: <b>жирный</b>, <i>курсив</i>. Обычные символы < и > лучше не ставить.
#   • После правки перезапустите бота (см. README, «Как обновить тексты или код»).
#  ✍️ — места, где нужно ваше решение или ваши данные.
# ============================================================

# ---------- Кодовые слова и лид-магниты ----------
# Метки utechki и agent используются в ссылках: t.me/ВАШ_БОТ?start=utechki и ?start=agent
# В words перечислите, какие слова бот понимает (регистр не важен, «ё» = «е»).
sources:
  utechki:
    words: [утечки, утечка, утечек]
    title: "«5 утечек магазина»"
    button: "💸 5 утечек магазина"
    intro: |
      {name}, здравствуйте! Рада, что вы здесь 🤍

      Держите видео <b>«5 утечек магазина»</b>. Это около 15 минут: я разбираю живые отчёты и показываю, куда магазин теряет прибыль, хотя оборот растёт.

      Смотрите спокойно, с отчётами своего кабинета под рукой — так будет полезнее.
  agent:
    words: [агент, агента, агенты]
    title: "«Создай агента за вечер»"
    button: "🤖 Агент за вечер"
    intro: |
      {name}, здравствуйте! Рада, что вы здесь 🤍

      Держите видео <b>«Создай агента за вечер»</b>. В нём я в прямом эфире собираю ИИ-агента, который готовит ответы на отзывы, и показываю, какие два файла ему нужны.

      Программировать не нужно: агенту вы объясняете работу так же, как новому сотруднику.

# Кнопка-ссылка под лид-магнитом, если видео дано ссылкой (а не файлом)
watch_button: "▶️ Смотреть видео"

# Если ссылку на видео ещё не вписали в .env (видят только до настройки)
lead_not_ready: |
  Видео скоро будет здесь. Я пришлю его, как только загружу 🙂

# ---------- Согласия. Первым делом, до любого материала, в том числе по ?start= ----------
# Пока не нажата кнопка ПДн, бот повторяет шаг 1 на любое сообщение и любую команду.
# Материал уходит и после «Да, присылайте», и после «Только материал».
# В прогрев и рассылку попадает только «Да, присылайте». /stop выключает рассылку в любой момент.
consent:
  pd: |
    Привет! Я бот Елены Тимошенко, ECOMLENA. Сейчас пришлю ваш материал, но сначала пара формальностей. Пожалуйста, ознакомьтесь с <a href="https://ecomlena.ru/privacy-policy/">политикой обработки персональных данных</a> и подтвердите <a href="https://ecomlena.ru/soglasie-pdn/">согласие на обработку данных</a>.
  mailing: |
    Спасибо! И последний вопрос: можно иногда присылать вам полезные разборы и предложения?

    <a href="https://ecomlena.ru/soglasie-rassylka/">Условия рассылки</a>
  unsubscribed: |
    Вы отписались от рассылки. Материалы и бот остаются доступны.

# ---------- /start без кодового слова ----------
welcome: |
  Здравствуйте! Я бот Елены Тимошенко 👋

  Помогаю селлерам WB и Ozon растить прибыль, а не штат: рутину забирают ИИ-агенты, решения остаются за вами.

  Что вам прислать?

# Если человек написал что-то непонятное
unknown: |
  Я понимаю кодовые слова из роликов: <b>УТЕЧКИ</b> или <b>АГЕНТ</b>.
  Или выберите видео кнопкой ниже 👇

# ---------- Через 10 минут после видео (для обоих слов) ----------
# Короткий прогрев + одна кнопка «Посмотреть программу» (ведёт на LANDING_URL, блок #program).
# Задержка: PROGRAM_DELAY_MINUTES (по умолчанию 10). 0 = отправить сразу после видео.
# Ночное правило на этот шаг не действует: уйдёт через 10 минут, даже если сейчас ночь.
# Цен и цифр здесь нет намеренно: тарифы человек увидит на лендинге.
after_lead: |
  Когда посмотрите видео, загляните в программу курса <b>«Прибыльный ИИ-отдел для селлера»</b> 🤍

  В видео — одна задача. В курсе мы шаг за шагом собираем для вашего магазина целый ИИ-отдел: от базы для любого ИИ-агента и 5 утечек прибыли до карточек, продвижения и операционки. Рутину забирают агенты, решения остаются за вами.

  Все модули и тарифы — по кнопке ниже 👇

buttons:
  pd_consent: "Согласна(сен) на обработку персональных данных"
  mailing_yes: "Да, присылайте"
  mailing_no: "Только материал"
  program: "📋 Посмотреть программу"
  channel: "📢 Подписаться на канал"
  bc_send: "✅ Отправить"
  bc_cancel: "✖️ Отмена"

# ---------- Отложенные сообщения ----------
# Порядок и задержки задаются в .env (минуты для after_lead, часы для остальных). 0 = не отправлять.
# Ночью бот не пишет: если время выпало на ночь, сообщение уйдёт в 10:00 по Москве.
# Исключение — сообщение с программой (after_lead): оно уходит через 10 минут даже ночью.

# Приглашение в канал (CHANNEL_INVITE_DELAY_HOURS, по умолчанию через 2 часа).
# Если CHANNEL_URL не задан, не отправляется.
# ✍️ Проверьте, что описание совпадает с тем, что действительно выходит в вашем канале.
channel_invite: |
  {name}, это снова Елена 🙂

  Если видео было полезным — заглядывайте в мой Telegram-канал. Там я разбираю, как селлеру расти в прибыли, а не в штате: сборки ИИ-агентов, разборы магазинов и то, что работает на WB и Ozon.

  Буду рада видеть вас среди подписчиков 🤍

# Прогрев 1 (WARMUP1_DELAY_HOURS, по умолчанию через сутки). История Елены.
# ✍️ Цифры здесь только из вашей истории. Если 1 млн ₽ — это оборот в месяц, допишите «оборота в месяц».
warmup1: |
  {name}, добрый день! Это Елена 🙂

  Расскажу коротко, откуда у меня эта система.

  Я зашла на маркетплейсы с 30 000 ₽ и за 9 месяцев вырастила их до 1 млн ₽. До этого протестировала больше 1000 товаров в дропшиппинге и работала в отделе развития бизнеса FMCG-корпорации. С 2022 года консультирую по маркетингу в e-commerce.

  Главное, что я поняла: магазин растёт не от того, сколько вы делаете руками, а от того, видите ли вы, где утекают деньги. Сейчас рутину можно отдать ИИ-агентам, а себе оставить решения.

  Именно так устроен курс «Прибыльный ИИ-отдел для селлера»: начинаем с базы для любого ИИ-агента и 5 утечек прибыли на цифрах вашего магазина, а дальше шаг за шагом собираем весь отдел. Загляните в программу 👇

# Прогрев 2 (WARMUP2_DELAY_HOURS, по умолчанию через 2,5 дня). Ответ на частые сомнения.
warmup2: |
  {name}, чаще всего селлеры говорят мне три вещи. Отвечу честно.

  <b>«Нужен программист».</b> Не нужен. Агенту вы объясняете работу так же, как новому сотруднику: что продаём, как отвечаем, куда не лезем. В практикуме готовые навыки и промпты, работу делает Kimi, вы проверяете.

  <b>«У меня нет времени».</b> Поэтому мы и начинаем с денег: сначала видно, какая утечка самая дорогая, и вы занимаетесь ей, а не всем сразу.

  <b>«ИИ сольёт бюджет».</b> Агент готовит черновик и подсвечивает проблему, а решение о деньгах — ставки, акции, поставки — подтверждаете вы.

  Посмотрите программу курса: там видно, с чего вы начнёте и что будет в каждом модуле 👇

# ---------- Для Елены (видит только админ из ADMIN_ID) ----------
admin:
  file_id: |
    file_id этого видео (вставьте в .env, LEAD_UTECHKI_FILE_ID или LEAD_AGENT_FILE_ID):
    <code>{file_id}</code>
  not_admin: "Эта команда только для Елены."

  # --- рассылка /broadcast ---
  bc_audiences:
    all: "Всем"
    utechki: "УТЕЧКИ"
    agent: "АГЕНТ"
  bc_ask: |
    📣 <b>Рассылка по базе</b>

    Пришлите сообщение, которое уйдёт людям: текст, фото или видео с подписью. Жирный, курсив и ссылки сохранятся.

    Нужна кнопка-ссылка? Добавьте последней строкой:
    <code>Кнопка: Текст на кнопке | https://ссылка</code>

    Передумали — /cancel
  bc_preview_title: "Так сообщение увидят люди 👇"
  bc_preview: |
    Кому: <b>{audience}</b> — {count} чел.

    В списке только те, кто согласился на рассылку и не остановил бота. Можно выбрать: всем согласившимся, пришедшим по слову УТЕЧКИ или по слову АГЕНТ. Затем нажмите «Отправить».
  bc_started: |
    🚀 Рассылка запущена: <b>{audience}</b> — {total} чел.
    Бот отправляет постепенно, не быстрее {rate} сообщений в секунду, и всё это время отвечает людям. Когда закончит, пришлю итог.
  bc_done: |
    ✅ <b>Рассылка завершена</b>
    Получателей: {total}
    Доставлено: {sent}
    Не доставлено из-за ошибки: {failed}
    Остановили бота: {blocked} (им больше не пишем)
  bc_cancelled: "Рассылка отменена, ничего не отправлено."
  bc_busy: "Сейчас уже идёт рассылка. Дождитесь итога, потом можно запускать следующую."
  bc_no_draft: "Черновик не найден. Начните заново: /broadcast"
  bc_unsupported: "Такой тип сообщения я не разошлю. Пришлите текст, фото или видео с подписью. Передумали — /cancel"
  bc_empty: "Сообщение пустое. Пришлите текст, фото или видео. Передумали — /cancel"
  bc_too_long: "Слишком длинно: подпись к фото или видео — до 1024 знаков, текст — до 4096. Сократите и пришлите снова."
  bc_button_bad: |
    Не поняла строку с кнопкой. Нужно так (последней строкой):
    <code>Кнопка: Текст на кнопке | https://ссылка</code>
    Пришлите сообщение ещё раз.

myid: |
  Ваш chat id: <code>{chat_id}</code>
  Его нужно вписать в настройку ADMIN_ID.
